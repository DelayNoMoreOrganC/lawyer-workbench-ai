<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 - 智能律师工作台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 40px;
      height: 40px;
      color: #ef4444;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .info {
      margin-top: 32px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      text-align: left;
    }

    .info h3 {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .info ul {
      list-style: none;
      padding: 0;
    }

    .info li {
      font-size: 12px;
      color: #6b7280;
      padding: 4px 0;
    }

    .info li::before {
      content: "•";
      color: #2563eb;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>

    <h1>网络连接已断开</h1>
    <p>您当前处于离线状态。请检查网络连接后重试。</p>

    <button class="button" onclick="location.reload()">重新连接</button>

    <div class="info">
      <h3>离线功能</h3>
      <ul>
        <li>查看已缓存的案件信息</li>
        <li>浏览已加载的文档</li>
        <li>编辑待办事项（联网后自动同步）</li>
        <li>查看日程安排</li>
      </ul>
    </div>
  </div>

  <script>
    // 监听网络状态变化
    window.addEventListener('online', function() {
      console.log('网络已连接');
      location.reload();
    });

    window.addEventListener('offline', function() {
      console.log('网络已断开');
    });
  </script>
</body>
</html>
